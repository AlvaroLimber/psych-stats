project:
  type: book

lang: es

book:
  title: "Psicoestadística"
  subtitle: "Apuntes para la carrera de Psicología"
  author: "MSc. Alvaro Chirino Gutierrez"
  description: "Libro destinado a la materia de Psicoestadística de la carrera de Psicología de la Universidad Católica Boliviana, sede La Paz."
  date: "2026-01-01"
  date-format: "YYYY"
  #favicon: logo.png
  twitter-card: true
  reader-mode: true
  site-url: https://alvarolimber.github.io/psych-stats/_book
  search: true
  repo-url: https://github.com/alvarolimber/psych-stats
  downloads: [pdf]
  sharing: [twitter, facebook]
  cover-image: cover.png
  page-footer:
    left: "Copyright 2026, Alvaro Chirino. CC BY-NC-SA 4.0"
    right:
      - icon: github
        href: https://github.com/alvarolimber/psych-stats
  chapters:
    - index.qmd # Prefacio / Introducción general
    - part: "Parte I: Diseño estadístico y estadística descriptiva"
      chapters:
        - fundamentos.qmd
        - descriptiva.qmd
    - part: "Parte II: Estadística teórica e inferencial"
      chapters:
        - teorica.qmd
        - herramientas.qmd
    - references.qmd

bibliography: references.bib
nocite: |
  @*

format:
  html:
    theme:
      dark: darkly
      light: flatly
    toc: true
